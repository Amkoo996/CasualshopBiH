<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casual Shop BiH | Udobna i stilska odjeća online</title>

    <!-- Preconnect konekcije za brze Google Fontove i Cloudinary -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- LCP Preload: Hero WebP slika se učitava sa najvišim prioritetom -->
    <link
      rel="preload"
      as="image"
      href="/hero-streetwear.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Google Analytics Consent Mode v2 (Default: DENIED za GDPR usklađenost) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied'
      });
      gtag('js', new Date());
      gtag('config', 'G-RL3ZGMND3K', { send_page_view: false });
    </script>
    
    <meta name="description" content="Casual Shop BiH - Udobna odjeća za svaki dan. Majice, duksevi, kape i streetwear komadi uz brzu dostavu širom BiH i plaćanje pouzećem." />
    <link rel="canonical" href="https://casualshopbih.pages.dev/" />

    <!-- Open Graph / Facebook / Instagram / Viber / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://casualshopbih.pages.dev/" />
    <meta property="og:title" content="Casual Shop BiH | Udobna i stilska odjeća online" />
    <meta property="og:description" content="Udobna odjeća za svaki dan. Plaćanje pouzećem • Dostava širom BiH." />
    <meta property="og:image" content="https://casualshopbih.pages.dev/hero-streetwear.webp" />
    <meta property="og:image:secure_url" content="https://casualshopbih.pages.dev/hero-streetwear.webp" />
    <meta property="og:image:type" content="image/webp" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Casual Shop BiH | Udobna i stilska odjeća online" />
    <meta name="twitter:description" content="Udobna odjeća za svaki dan. Plaćanje pouzećem • Dostava širom BiH." />
    <meta name="twitter:image" content="https://casualshopbih.pages.dev/hero-streetwear.webp" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo-favicon.svg" />

    <!-- Autentični Streetwear fontovi (Inter i Poppins) uz display=swap optimizaciju -->
    <link 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700;800;900&display=swap" 
      rel="stylesheet" 
    />

    <style>
      :root {
        --font-poppins: 'Poppins', system-ui, sans-serif;
        --font-inter: 'Inter', system-ui, sans-serif;
      }
      body {
        font-family: var(--font-inter);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      h1, h2, h3, .font-poppins {
        font-family: var(--font-poppins);
      }
    </style>
  </head>
  <body class="bg-[#F4F2EC] text-[#111111] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
